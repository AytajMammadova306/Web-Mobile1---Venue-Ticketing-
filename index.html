<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Venue Ticketing</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/script.js" defer></script>
</head>
<body>

  <header class="site-header">
    <h1>Venue Ticketing</h1>
  </header>

  <main class="layout">
    <section class="map-section" aria-label="Venue map">
      <div class="map-controls" role="group" aria-label="Map controls">
        <button id="zoom-in" type="button">Zoom In</button>
        <button id="zoom-out" type="button">Zoom Out</button>
        <button id="move-up" type="button">Up</button>
        <button id="move-down" type="button">Down</button>
        <button id="move-left" type="button">Left</button>
        <button id="move-right" type="button">Right</button>
        <button id="reset-view" type="button">Reset View</button>
      </div>

      <div id="map-viewport" class="map-viewport">
        <div id="venue" class="venue">
          <!-- seats will be here -->
        </div>
      </div>

      <ul class="legend" aria-label="Seat legend">
        <li><span class="swatch available"></span> Available</li>
        <li><span class="swatch inspected"></span> Inspected</li>
        <li><span class="swatch in-cart"></span> In cart</li>
        <li><span class="swatch unavailable"></span> Unavailable</li>
      </ul>
    </section>
    <aside class="side-panel">

      <section id="seat-details" class="seat-details" aria-live="polite">
        <h2>Seat Details</h2>
        <p id="seat-details-empty">Select a seat to see its details.</p>
        <dl id="seat-details-info" hidden>
          <dt>Section</dt><dd id="detail-section"></dd>
          <dt>Row</dt><dd id="detail-row"></dd>
          <dt>Seat</dt><dd id="detail-seat"></dd>
          <dt>Price</dt><dd id="detail-price"></dd>
          <dt>Status</dt><dd id="detail-status"></dd>
        </dl>
        <button id="add-to-cart" type="button" disabled>Add to Cart</button>
      </section>

      <section id="cart" class="cart">
        <h2>Cart</h2>
        <ul id="cart-items"></ul>
        <p id="cart-empty">Your cart is empty.</p>
        <p class="cart-total">Total: <strong id="cart-total">$0</strong></p>
      </section>

    </aside>
  </main>

  <footer class="site-footer">
    <p>Web &amp; Mobile I – Vanue Ticketing Project</p>
  </footer>

</body>
</html>
